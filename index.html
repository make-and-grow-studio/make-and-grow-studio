<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#DCD8CD" />

    <!-- ── Core ──────────────────────────────────────────────
         Title leads with the brand, then the two things people actually
         type: what we do, and where. Kept under ~60 characters so Google
         doesn't truncate it in results. -->
    <title>Make &amp; Grow — Design &amp; Digital Marketing Studio, Coimbatore</title>
    <meta
      name="description"
      content="AI-native design, web development and digital marketing studio in Coimbatore. Brand identity, websites and growth marketing — first draft in 72 hours."
    />
    <link rel="canonical" href="https://make-and-grow-studio.designwithramki.workers.dev/" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="author" content="Make &amp; Grow" />

    <!-- ── Local signals ─────────────────────────────────────
         These do not rank a page on their own, but they corroborate the
         address in the structured data below, which is what local results
         are actually built from. Coordinates are Coimbatore city centre. -->
    <meta name="geo.region" content="IN-TN" />
    <meta name="geo.placename" content="Coimbatore, Tamil Nadu" />
    <meta name="geo.position" content="11.0168;76.9558" />
    <meta name="ICBM" content="11.0168, 76.9558" />

    <!-- ── Sharing ───────────────────────────────────────────
         og:image is the wordmark for now — it is the wrong shape (1024×153
         against the 1200×630 both Facebook and X expect) and will letterbox
         in a share card. Replace it with a proper cover and this is done. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Make &amp; Grow" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://make-and-grow-studio.designwithramki.workers.dev/" />
    <meta
      property="og:title"
      content="Make &amp; Grow — Design &amp; Digital Marketing Studio, Coimbatore"
    />
    <meta
      property="og:description"
      content="AI-native design, web development and digital marketing studio in Coimbatore. Brand identity, websites and growth marketing — first draft in 72 hours."
    />
    <meta property="og:image" content="https://make-and-grow-studio.designwithramki.workers.dev/brand/logo-wordmark.png" />
    <meta property="og:image:alt" content="Make &amp; Grow" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Make &amp; Grow — Design &amp; Digital Marketing Studio, Coimbatore"
    />
    <meta
      name="twitter:description"
      content="AI-native design, web development and digital marketing studio in Coimbatore. Brand identity, websites and growth marketing — first draft in 72 hours."
    />
    <meta name="twitter:image" content="https://make-and-grow-studio.designwithramki.workers.dev/brand/logo-wordmark.png" />

    <link rel="icon" href="/brand/mark-ampersand.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/mark-ampersand.png" />

    <!-- Type is the identity here; it has to land in the first paint. Only
         the three that appear above the fold — the marker hand is used
         sparingly and further down, so it can load normally. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/archivo-var.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-sans-var.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-var.woff2" crossorigin />

    <!-- ── Structured data ───────────────────────────────────
         This is the part that does the heavy lifting for "design studio in
         Coimbatore" style searches. It sits in the static HTML rather than
         in React, so Google reads it without having to run any JavaScript.
         No aggregateRating: inventing review counts is a manual action
         waiting to happen, and it is trivially checkable. Add it once real
         reviews exist. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://make-and-grow-studio.designwithramki.workers.dev/#studio",
        "name": "Make & Grow",
        "alternateName": "Make & Grow Studios",
        "url": "https://make-and-grow-studio.designwithramki.workers.dev/",
        "logo": "https://make-and-grow-studio.designwithramki.workers.dev/brand/logo-wordmark.png",
        "image": "https://make-and-grow-studio.designwithramki.workers.dev/brand/logo-wordmark.png",
        "description": "AI-native design, build and growth studio in Coimbatore. Brand identity, UI/UX, web development and digital marketing for brands that refuse to look ordinary.",
        "email": "makeandgrowstudios@gmail.com",
        "telephone": "+91-8778621851",
        "foundingDate": "2026",
        "priceRange": "$$",
        "currenciesAccepted": "INR",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Coimbatore",
          "addressRegion": "Tamil Nadu",
          "postalCode": "641001",
          "addressCountry": "IN"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 11.0168,
          "longitude": 76.9558
        },
        "areaServed": [
          { "@type": "City", "name": "Coimbatore" },
          { "@type": "State", "name": "Tamil Nadu" },
          { "@type": "Country", "name": "India" }
        ],
        "sameAs": [
          "https://www.instagram.com/makeandgrow.studio",
          "https://www.linkedin.com/company/make-and-grow-studios/"
        ],
        "knowsAbout": [
          "Brand identity design",
          "UI/UX design",
          "Web development",
          "Digital marketing",
          "Social media marketing",
          "Search engine optimisation",
          "Motion design"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Design",
                "description": "Brand identity, UI/UX and social and ad creatives that make you look premium.",
                "serviceType": "Graphic and brand design"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Build",
                "description": "Fast, modern, AI-native websites, web apps and motion. You launch sooner, not eventually.",
                "serviceType": "Web development"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Grow",
                "description": "Social, content and paid ads marketing that turns attention into customers.",
                "serviceType": "Digital marketing"
              }
            }
          ]
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://make-and-grow-studio.designwithramki.workers.dev/#website",
        "url": "https://make-and-grow-studio.designwithramki.workers.dev/",
        "name": "Make & Grow",
        "inLanguage": "en-IN",
        "publisher": { "@id": "https://make-and-grow-studio.designwithramki.workers.dev/#studio" }
      }
    </script>
  </head>
  <body>
    <a
      href="#main"
      style="
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 999;
        padding: 0.75rem 1rem;
        background: #E4551C;
        color: #ffffff;
      "
      onfocus="this.style.left='0'"
      onblur="this.style.left='-9999px'"
      >Skip to content</a
    >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
